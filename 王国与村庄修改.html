<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>世界盒子 · 王国与村庄</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link href="https://cdn.staticfile.net/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        * {
            scrollbar-width: thin;
            scrollbar-color: #4b5563 #1e1e1e
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px
        }
        ::-webkit-scrollbar-track {
            background: #1e1e1e;
            border-radius: 4px
        }
        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px
        }
        body {
            background: #121212;
            color: #e5e5e5;
            font-family: system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif;
            padding-bottom: env(safe-area-inset-bottom)
        }
        .card {
            background: #1e1e1e;
            border-radius: 1rem;
            border: 1px solid #2d2d2d;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            transition: transform .2s, box-shadow .2s;
            margin-bottom: 1.5rem;
            overflow: hidden
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
            border-color: #3b82f6
        }
        .custom-input {
            width: 100%;
            padding: .75rem 1rem .75rem 2.5rem;
            background-color: #0f0f0f;
            border: 1px solid #333;
            border-radius: .75rem;
            outline: none;
            transition: all .2s;
            font-size: 1rem;
            color: #f0f0f0
        }
        .custom-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
            background-color: #1a1a1a
        }
        .custom-input-sm {
            padding: .5rem .75rem;
            font-size: .875rem
        }
        .file-upload-wrapper {
            position: relative;
            width: 100%;
            height: 130px;
            border: 2px dashed #374151;
            border-radius: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all .2s;
            background-color: #0f0f1a
        }
        .file-upload-wrapper:hover {
            border-color: #3b82f6;
            background-color: #1e293b;
            transform: scale(.99)
        }
        .file-upload-wrapper input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer
        }
        .btn-primary {
            background: linear-gradient(105deg, #2563eb, #1d4ed8);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            transition: all .2s
        }
        .btn-primary:hover {
            background: linear-gradient(105deg, #3b82f6, #2563eb);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4)
        }
        .btn-success {
            background: linear-gradient(105deg, #059669, #047857);
            transition: all .2s
        }
        .btn-success:hover {
            background: linear-gradient(105deg, #10b981, #059669);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3)
        }
        .btn-secondary {
            background: linear-gradient(105deg, #4b5563, #374151);
            transition: all .2s
        }
        .btn-secondary:hover {
            background: linear-gradient(105deg, #6b7280, #4b5563);
            box-shadow: 0 4px 12px rgba(107, 114, 128, 0.3)
        }
        .btn-danger {
            background: linear-gradient(105deg, #dc2626, #b91c1c);
            transition: all .2s
        }
        .btn-danger:hover {
            background: linear-gradient(105deg, #ef4444, #dc2626);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3)
        }
        button:active {
            transform: scale(.97)
        }
        .badge-version {
            background: rgba(59, 130, 246, 0.2);
            backdrop-filter: blur(2px);
            border: 1px solid rgba(59, 130, 246, 0.4)
        }
        .status-message {
            background: #1e1e2f;
            border-left: 4px solid;
            border-radius: .75rem;
            padding: .75rem 1rem;
            font-size: .85rem;
            display: none;
            margin-bottom: 1rem
        }
        .status-message.success {
            border-left-color: #10b981;
            background: rgba(16, 185, 129, 0.1);
            color: #a7f3d0
        }
        .status-message.error {
            border-left-color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
            color: #fecaca
        }
        .status-message.warning {
            border-left-color: #f59e0b;
            background: rgba(245, 158, 11, 0.1);
            color: #fed7aa
        }
        .status-message.info {
            border-left-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
            color: #93c5fd
        }
        .fade-in {
            animation: fadeInUp .3s cubic-bezier(0.2, 0.9, 0.4, 1.1)
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(8px)
            }
            to {
                opacity: 1;
                transform: translateY(0)
            }
        }
        .kingdom-card,
        .village-card {
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: .75rem;
            padding: .6rem .75rem;
            cursor: pointer;
            transition: all .2s
        }
        .kingdom-card:hover,
        .village-card:hover {
            border-color: #3b82f6;
            background: #1a1a2a
        }
        .kingdom-card.active,
        .village-card.active {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.12);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.08)
        }
        .kingdom-card .card-content .name {
            font-weight: 600;
            color: #93c5fd
        }
        .kingdom-card .card-content .sub,
        .village-card .card-content .sub {
            font-size: .8rem;
            color: #9ca3af;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: .1rem
        }
        .kingdom-card .card-content .sub span,
        .village-card .card-content .sub span {
            display: flex;
            align-items: center;
            gap: .3rem
        }
        .capital-badge {
            background: #f59e0b;
            color: #000;
            font-size: .6rem;
            font-weight: 700;
            padding: 0.1rem 0.5rem;
            border-radius: 1rem;
            margin-left: 0.4rem;
            display: inline-block;
        }
        .list-container {
            max-height: calc(50vh - 100px);
            min-height: 120px;
            overflow-y: auto
        }
        .ruler-card {
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: .75rem;
            padding: .6rem .75rem;
            transition: all .2s;
            margin-bottom: .5rem
        }
        .ruler-card:hover {
            border-color: #3b82f6;
            background: #1a1a2a
        }
        .ruler-card .field {
            display: flex;
            flex-direction: column
        }
        .ruler-card .field label {
            font-size: .65rem;
            color: #6b7280;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: .03em
        }
        .ruler-card .field input,
        .ruler-card .field select {
            background: #0f0f0f;
            border: 1px solid #333;
            border-radius: .4rem;
            padding: .2rem .4rem;
            color: #f0f0f0;
            font-size: .8rem;
            outline: none;
            width: 100%;
            transition: .2s
        }
        .ruler-card .field input:focus,
        .ruler-card .field select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15)
        }
        .ruler-card .btn-sm {
            padding: .1rem .5rem;
            font-size: .7rem;
            border-radius: .3rem;
            background: #2d2d2d;
            color: #ccc;
            border: none;
            cursor: pointer;
            transition: .2s
        }
        .ruler-card .btn-sm.danger {
            background: #7f1d1d
        }
        .ruler-card .btn-sm.danger:hover {
            background: #b91c1c
        }
        .ruler-list-container {
            max-height: 200px;
            overflow-y: auto
        }
        .add-bar {
            display: flex;
            gap: .3rem;
            flex-wrap: wrap;
            align-items: center;
            margin-top: .5rem;
            padding: .3rem .5rem;
            background: #0f0f1a;
            border-radius: .5rem;
            border: 1px solid #2d2d2d
        }
        .add-bar input,
        .add-bar select {
            background: #0f0f0f;
            border: 1px solid #333;
            border-radius: .3rem;
            padding: .15rem .3rem;
            color: #f0f0f0;
            font-size: .75rem;
            outline: none;
            width: 80px
        }
        .add-bar input:focus,
        .add-bar select:focus {
            border-color: #3b82f6
        }
        .add-bar button {
            background: #1e293b;
            border: none;
            color: #93c5fd;
            border-radius: .3rem;
            padding: .15rem .6rem;
            font-size: .7rem;
            cursor: pointer;
            transition: .2s
        }
        .add-bar button:hover {
            background: #2d3d5a
        }
        .section-divider {
            margin: 0.5rem 0;
            border-top: 1px solid #2d2d2d
        }
        .edit-section {
            margin-bottom: 1rem
        }
        .checkbox-inline {
            display: flex;
            align-items: center;
            gap: .4rem;
            font-size: .75rem;
            color: #9ca3af;
            cursor: pointer
        }
        .checkbox-inline input[type="checkbox"] {
            accent-color: #3b82f6;
            width: 1rem;
            height: 1rem;
            cursor: pointer
        }
        .form-input {
            width: 100%;
            padding: .6rem .9rem;
            background-color: #0f0f0f;
            border: 1px solid #333;
            border-radius: .75rem;
            outline: none;
            transition: all .2s;
            font-size: .9rem;
            color: #f0f0f0
        }
        .form-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
            background-color: #1a1a1a
        }
        .form-select {
            width: 100%;
            padding: .6rem .9rem;
            background-color: #0f0f0f;
            border: 1px solid #333;
            border-radius: .75rem;
            outline: none;
            transition: all .2s;
            font-size: .9rem;
            color: #f0f0f0;
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right .75rem center;
            background-repeat: no-repeat;
            background-size: 1.2rem
        }
        .form-select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
            background-color: #1a1a1a
        }
        .form-label {
            display: block;
            font-size: .8rem;
            font-weight: 500;
            color: #9ca3af;
            margin-bottom: .3rem
        }
        .empty-state {
            color: #6b7280;
            text-align: center;
            padding: 2.5rem 1rem
        }
        .empty-state i {
            font-size: 2.5rem;
            opacity: .3;
            display: block;
            margin-bottom: .75rem
        }
        .hidden {
            display: none !important
        }
        .progress-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            backdrop-filter: blur(4px);
            transition: opacity .3s;
        }
        .progress-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .progress-box {
            background: #1e1e2e;
            border-radius: 1.5rem;
            padding: 2rem 2.5rem;
            max-width: 90vw;
            width: 400px;
            text-align: center;
            border: 1px solid #3b82f6;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }
        .progress-box .title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #93c5fd;
            margin-bottom: .5rem;
        }
        .progress-box .sub {
            font-size: .85rem;
            color: #9ca3af;
            margin-bottom: 1.2rem;
        }
        .progress-track {
            width: 100%;
            height: 8px;
            background: #2d2d3d;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: .6rem;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            border-radius: 4px;
            transition: width .15s ease;
        }
        .progress-text {
            font-size: .8rem;
            color: #6b7280;
        }
        .progress-text strong {
            color: #e5e5e5;
        }
        .tab-nav {
            display: flex;
            gap: 0;
            background: #1a1a1a;
            border-radius: .75rem;
            border: 1px solid #2d2d2d;
            overflow: hidden;
            margin-bottom: 1.5rem
        }
        .tab-nav a.nav-link {
            flex: 1;
            padding: .7rem 1rem;
            background: transparent;
            color: #9ca3af;
            font-size: .9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all .2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .5rem;
            border-bottom: 2px solid transparent;
            text-decoration: none;
            border-radius: 0
        }
        .tab-nav a.nav-link:hover {
            color: #e5e5e5;
            background: #1e1e2e;
            text-decoration: none
        }
        .tab-nav a.nav-link.active {
            color: #60a5fa;
            border-bottom-color: #3b82f6;
            background: rgba(59, 130, 246, 0.08)
        }
        .tab-nav a.nav-link i {
            font-size: .9rem
        }
        .tab-nav a.nav-link:first-child {
            border-radius: .75rem 0 0 .75rem
        }
        .tab-nav a.nav-link:last-child {
            border-radius: 0 .75rem .75rem 0
        }
        .tab-nav a.nav-link:first-child.active {
            border-radius: .75rem 0 0 .75rem
        }
        .tab-nav a.nav-link:last-child.active {
            border-radius: 0 .75rem .75rem 0
        }
        .tab-nav a.nav-link:only-child.active {
            border-radius: .75rem
        }
        .res-select {
            width: 120px
        }
        .res-amount {
            width: 60px
        }
        .equip-section .ruler-card .field {
            flex: 1;
            min-width: 0
        }
        .equip-label {
            font-size: .75rem;
            font-weight: 600;
            color: #6b7280;
            margin-top: .5rem;
            margin-bottom: .2rem
        }
        .equip-add-input {
            width: 80px
        }
        .input-row {
            display: flex;
            gap: .3rem;
            align-items: center;
        }
        .input-row input {
            flex: 1;
            min-width: 0;
        }
        .input-row .btn-sm {
            padding: .1rem .5rem;
            font-size: .7rem;
            border-radius: .3rem;
            background: #2d2d2d;
            color: #ccc;
            border: none;
            cursor: pointer;
            transition: .2s;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .input-row .btn-sm:hover {
            background: #4b5563;
        }
        .actor-preview {
            margin-top: .2rem;
            font-size: .7rem;
            color: #9ca3af;
            background: #0f0f1a;
            border-radius: .3rem;
            padding: .2rem .4rem;
            border: 1px solid #2d2d2d;
            display: none;
        }
        .actor-preview.visible {
            display: block;
        }
        .actor-preview .label {
            color: #6b7280;
        }
        .actor-preview .val {
            color: #e5e5e5;
        }
        .equip-preview {
            margin-top: .2rem;
            font-size: .7rem;
            color: #9ca3af;
            background: #0f0f1a;
            border-radius: .3rem;
            padding: .2rem .4rem;
            border: 1px solid #2d2d2d;
            display: none;
        }
        .equip-preview.visible {
            display: block;
        }
        .equip-preview .label {
            color: #6b7280;
        }
        .equip-preview .val {
            color: #e5e5e5;
        }
        @media(max-width:768px) {
            .list-container {
                max-height: 30vh;
                min-height: 100px
            }
            .ruler-list-container {
                max-height: 150px
            }
            .card .p-4 {
                padding: .75rem
            }
            .form-label {
                font-size: .7rem
            }
            .tab-nav a.nav-link {
                font-size: .75rem;
                padding: .5rem .5rem
            }
            .tab-nav a.nav-link i {
                font-size: .75rem
            }
            .kingdom-card .card-content .sub,
            .village-card .card-content .sub {
                font-size: .7rem;
                gap: .5rem
            }
            .add-bar input,
            .add-bar select {
                width: 60px;
                font-size: .65rem
            }
            .add-bar .res-select {
                width: 90px
            }
            .add-bar .res-amount {
                width: 50px
            }
            .progress-box {
                padding: 1.5rem;
                width: 90vw;
            }
        }
        @media(max-width:480px) {
            .tab-nav a.nav-link {
                font-size: .65rem;
                padding: .4rem .3rem;
                gap: .2rem
            }
            .tab-nav a.nav-link i {
                font-size: .65rem
            }
        }
    </style>
</head>
<body>
    <header class="bg-gradient-to-r from-slate-900 via-gray-900 to-indigo-900 border-b border-indigo-500/30 sticky top-0 z-50 shadow-2xl backdrop-blur-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-dungeon text-indigo-400 text-xl"></i>
                <div>
                    <h1 class="text-lg font-bold bg-gradient-to-r from-blue-400 to-indigo-300 bg-clip-text text-transparent">世界盒子 · 王国与村庄</h1>
                    <p class="text-[10px] text-gray-400 hidden xs:block">修改王国 · 村庄 · 历史</p>
                </div>
            </div>
            <div class="badge-version text-xs px-2 py-0.5 rounded-full text-indigo-300 font-mono flex items-center gap-1">
                <span id="file-badge">未加载</span>
                <i class="fa-regular fa-circle-check text-emerald-400 hidden" id="loaded-icon"></i>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 pt-2">
        <div id="statusArea" class="status-message fade-in"></div>

        <div class="tab-nav" id="mainTabs">
            <a href="武器修改.html" class="nav-link" data-tab="weapon"><i class="fa-solid fa-sword"></i> 武器修改</a>
            <a href="王国与村庄修改.html" class="nav-link active" data-tab="kingdom"><i class="fa-solid fa-crown"></i> 王国与村庄修改</a>
            <a href="生物修改.html" class="nav-link" data-tab="actor"><i class="fa-solid fa-user"></i> 生物修改</a>
        </div>

        <div id="uploadSection" class="card p-4">
            <div class="flex items-center gap-2 border-b border-gray-800 pb-2 mb-3">
                <i class="fa-solid fa-cloud-upload-alt text-indigo-400"></i>
                <h2 class="text-base font-semibold text-indigo-300">上传存档</h2>
            </div>
            <div class="file-upload-wrapper" id="dropZone">
                <input type="file" id="fileInput" accept=".json">
                <i class="fa-solid fa-file-json text-3xl text-indigo-400/60 mb-1"></i>
                <p class="text-sm text-gray-400 font-medium" id="fileNameDisplay">点击或拖拽 .json 存档文件至此</p>
                <p class="text-xs text-gray-500 mt-0.5">世界盒子存档 · 本地处理</p>
            </div>
        </div>

        <div id="editorContainer" class="hidden">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-3">
                <div class="lg:col-span-5 card p-3">
                    <div class="flex items-center gap-2 border-b border-gray-800 pb-2 mb-2">
                        <i class="fa-solid fa-crown text-indigo-400"></i>
                        <h2 class="text-base font-semibold text-indigo-300">王国列表</h2>
                        <span class="ml-auto text-xs text-gray-500" id="kingdomCount">0 个</span>
                    </div>
                    <div class="flex gap-2 mb-2 flex-wrap">
                        <div class="relative flex-1 min-w-[100px]">
                            <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 text-sm"></i>
                            <input type="text" id="kingdomSearch" placeholder="搜索王国..." class="custom-input custom-input-sm pl-8 w-full">
                        </div>
                    </div>
                    <div class="list-container" id="kingdomListContainer"></div>
                    <hr class="section-divider">
                    <div class="flex items-center gap-2 border-b border-gray-800 pb-2 mb-2 mt-2">
                        <i class="fa-solid fa-house-chimney text-indigo-400"></i>
                        <h2 class="text-base font-semibold text-indigo-300">村庄列表</h2>
                        <span class="ml-auto text-xs text-gray-500" id="villageCount">0 个</span>
                    </div>
                    <div class="flex gap-2 mb-2 flex-wrap">
                        <div class="relative flex-1 min-w-[100px]">
                            <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 text-sm"></i>
                            <input type="text" id="villageSearch" placeholder="搜索村庄..." class="custom-input custom-input-sm pl-8 w-full">
                        </div>

                villageRulerList.querySelectorAll('.ruler-card').forEach((card, idx) => {
                    const idInp = card.querySelector('.ruler-id'),
                        colorInp = card.querySelector('.ruler-color'),
                        nameInp = card.querySelector('.ruler-name'),
                        agoInp = card.querySelector('.ruler-ago'),
                        endInp = card.querySelector('.ruler-end');
                    const updateRuler = () => {
                        const r = currentVillageRulers[idx];
                        if (r) { r.id = parseInt(idInp.value) || 0;
                            r.color_id = parseInt(colorInp.value) || 0;
                            r.name = nameInp.value.trim() || '未知';
                            r.timestamp_ago = parseFloat(agoInp.value) || 0;
                            r.timestamp_end = parseFloat(endInp.value) || 0 }
                    };
                    [idInp, colorInp, nameInp, agoInp, endInp].forEach(inp => { inp.addEventListener('change',
                            updateRuler);
                        inp.addEventListener('input', updateRuler) });
                    card.querySelector('.remove-ruler').addEventListener('click', function() {
                        currentVillageRulers.splice(idx, 1);
                        renderVillageRulers();
                    });
                });
            }

            function renderVillagePastNames() {
                if (!currentVillagePastNames.length) {
                    villagePastNameList.innerHTML =
                        `<div class="text-xs text-gray-500 py-1">无历史名称，点击 "添加" 增加</div>`;
                    return;
                }
                let html = '';
                currentVillagePastNames.forEach((n, idx) => {
                    html += `<div class="ruler-card" data-idx="${idx}">
                        <div class="grid grid-cols-1 sm:grid-cols-4 gap-2">
                            <div class="field"><label>名称</label><input type="text" class="past-name" value="${escapeHtml(n.name||'')}" placeholder="名称"></div>
                            <div class="field"><label>时间</label><input type="number" class="past-timestamp" value="${n.timestamp||0}" placeholder="时间"></div>
                            <div class="field"><label>颜色</label><input type="number" class="past-color" value="${n.color_id!==undefined?n.color_id:-1}" placeholder="颜色"></div>
                            <div class="field"><label>自定义</label>
                                <select class="past-custom"><option value="true" ${n.custom?'selected':''}>是</option><option value="false" ${!n.custom?'selected':''}>否</option></select>
                            </div>
                            <div class="field flex justify-end items-end"><button class="btn-sm danger remove-pastname"><i class="fa-solid fa-trash-can"></i> 删除</button></div>
                        </div>
                    </div>`;
                });
                villagePastNameList.innerHTML = html;
                villagePastNameList.querySelectorAll('.ruler-card').forEach((div, idx) => {
                    const nameInp = div.querySelector('.past-name'),
                        timeInp = div.querySelector('.past-timestamp'),
                        colorInp = div.querySelector('.past-color'),
                        customSel = div.querySelector('.past-custom');
                    const update = () => { const n = currentVillagePastNames[idx]; if (n) { n.name =
                                nameInp.value.trim() || '未命名';
                            n.timestamp = parseFloat(timeInp.value) || 0;
                            n.color_id = parseInt(colorInp.value) || -1;
                            n.custom = customSel.value === 'true' } };
                    [nameInp, timeInp, colorInp, customSel].forEach(el => { el.addEventListener('change',
                            update);
                        el.addEventListener('input', update) });
                    div.querySelector('.remove-pastname').addEventListener('click', function() {
                        currentVillagePastNames.splice(idx, 1);
                        renderVillagePastNames();
                    });
                });
            }

            function saveVillage() {
                if (selectedVillageIdx < 0 || selectedVillageIdx >= villages.length) return;
                pushHistory();
                const v = villages[selectedVillageIdx];
                const fields = {
                    'v_id': 'id',
                    'v_name': 'name',
                    'v_race': 'original_actor_asset',
                    'v_kingdomID': 'kingdomID',
                    'v_leaderID': 'leaderID',
                    'v_founder_id': 'founder_id',
                    'v_founder_name': 'founder_name',
                    'v_last_leader_id': 'last_leader_id',
                    'v_last_kingdom_id': 'last_kingdom_id',
                    'v_culture': 'id_culture',
                    'v_language': 'id_language',
                    'v_religion': 'id_religion',
                    'v_moved': 'moved',
                    'v_migrated': 'migrated',
                    'v_deaths': 'total_deaths',
                    'v_births': 'total_births',
                    'v_kills': 'total_kills',
                    'v_deathnat': 'deaths_natural',
                    'v_deathfire': 'deaths_fire',
                    'v_deathweapon': 'deaths_weapon',
                    'v_deathdrown': 'deaths_drowning',
                    'v_deathother': 'deaths_other',
                    'v_renown': 'renown',
                    'v_custom_name': 'custom_name',
                    'v_name_culture_id': 'name_culture_id',
                    'v_created_time': 'created_time',
                    'v_food': 'total_food_consumed',
                    'v_timer': 'timer_supply'
                };
                Object.keys(fields).forEach(id => {
                    const el = $(id);
                    if (el) {
                        let val = el.value;
                        const field = fields[id];
                        if (field === 'custom_name') val = val === 'true';
                        else if (field !== 'name' && field !== 'original_actor_asset' && field !==
                            'founder_name') { val = parseFloat(val); if (isNaN(val)) val = 0 }
                        v[field] = val;
                    }
                });
                v.past_rulers = currentVillageRulers.map(r => ({ ...r }));
                v.total_leaders = v.past_rulers.length;
                v.past_names = currentVillagePastNames.map(n => ({ ...n }));
                v.equipment = {
                    item_storage_weapons: currentEquipment.item_storage_weapons,
                    item_storage_helmets: currentEquipment.item_storage_helmets,
                    item_storage_armor: currentEquipment.item_storage_armor,
                    item_storage_boots: currentEquipment.item_storage_boots,
                    item_storage_rings: currentEquipment.item_storage_rings,
                    item_storage_amulets: currentEquipment.item_storage_amulets
                };
                v.zones = currentZones.map(z => ({ x: z.x, y: z.y }));
                v.resources = { saved_resources: currentResources.map(r => ({ id: r.id, amount: r.amount })) };
                renderVillageList();
                showStatus(`✓ 村庄 #${selectedVillageIdx+1} 已保存`, 'success');
            }

            function resetVillageSelection() {
                selectedVillageIdx = -1;
                villageEditForm.classList.add('hidden');
                villageFormEmpty.classList.remove('hidden');
                renderVillageList();
                showStatus('已取消选择', 'info');
            }

            function handleFile(file) {
                if (!file) { showStatus('未选择文件', 'error'); return }
                if (!file.name.toLowerCase().endsWith('.json')) { showStatus('请上传 .json 文件', 'error'); return }
                progressOverlay.classList.remove('hidden');
                progressBar.style.width = '0%';
                progressPercent.textContent = '0';
                progressSub.textContent = '读取文件...';
                const reader = new FileReader();
                reader.onprogress = function(e) {
                    if (e.lengthComputable) { const pct = Math.round((e.loaded / e.total) * 80);
                        progressBar.style.width = pct + '%';
                        progressPercent.textContent = pct;
                        progressSub.textContent = `读取中 ${pct}%` }
                };
                reader.onload = function(e) {
                    progressSub.textContent = '解析数据...';
                    progressBar.style.width = '85%';
                    progressPercent.textContent = '85';
                    setTimeout(() => {
                        try {
                            const json = JSON.parse(e.target.result);
                            if (!json.items || !Array.isArray(json.items)) throw new Error(
                                '缺少 items 数组，请确认是有效的世界盒子存档');
                            saveData = json;
                            kingdoms = json.kingdoms || [];
                            if (!kingdoms.length && json.Kingdoms) kingdoms = json.Kingdoms;
                            kingdoms.forEach(k => { if (!k.past_rulers) k.past_rulers = [];
                                if (k.total_kings === undefined) k.total_kings = k.past_rulers
                                .length });
                            let vdata = json.cities || json.villages || json.Villages || json
                            .village || [];
                            if (vdata.length) { if (json.cities) villageKey = 'cities';
                                else if (json.villages) villageKey = 'villages';
                                else if (json.Villages) villageKey = 'Villages';
                                else if (json.village) villageKey = 'village' } else villageKey =
                                'cities';
                            villages = vdata;
                            villages.forEach(v => { if (!v.past_rulers) v.past_rulers = [];
                                if (!v.past_names) v.past_names = [];
                                if (v.total_leaders === undefined) v.total_leaders = v.past_rulers
                                    .length;
                                if (!v.equipment) v.equipment = {};
                                if (!v.zones) v.zones = [];
                                if (!v.resources) v.resources = { saved_resources: [] };
                                if (!v.resources.saved_resources) v.resources
                                .saved_resources = [] });
                            actorsData = json.actors_data || [];
                            itemsData = json.items || [];
                            history = [];
                            historyIndex = -1;
                            selectedKingdomIdx = -1;
                            selectedVillageIdx = -1;
                            kingdomSearchText = '';
                            kingdomSearch.value = '';
                            villageSearchText = '';
                            villageSearch.value = '';
                            showAllVillages = false;
                            showAllVillagesCheck.checked = false;
                            fileNameDisplay.innerHTML =
                                `<i class="fa-regular fa-file-lines mr-1"></i> ${escapeHtml(file.name)} (${kingdoms.length}个王国, ${villages.length}个村庄)`;
                            fileNameDisplay.classList.add('text-indigo-400', 'font-semibold');
                            fileBadge.textContent = file.name;
                            loadedIcon.classList.remove('hidden');
                            uploadSection.classList.add('hidden');
                            editorContainer.classList.remove('hidden');
                            editorContainer.classList.add('fade-in');
                            renderKingdomList();
                            renderVillageList();
                            kingdomEditForm.classList.add('hidden');
                            kingdomFormEmpty.classList.remove('hidden');
                            villageEditForm.classList.add('hidden');
                            villageFormEmpty.classList.remove('hidden');
                            villageEditSection.classList.add('hidden');
                            if (kingdoms.length) selectKingdom(0);
                            progressBar.style.width = '100%';
                            progressPercent.textContent = '100';
                            progressSub.textContent = '加载完成';
                            setTimeout(() => {
                                progressOverlay.classList.add('hidden');
                                showStatus(`✓ 加载成功！${kingdoms.length} 个王国, ${villages.length} 个村庄`,
                                    'success');
                            }, 300);
                        } catch (err) {
                            console.error(err);
                            progressOverlay.classList.add('hidden');
                            showStatus('解析失败: ' + err.message, 'error');
                            fileInput.value = '';
                        }
                    }, 50);
                };
                reader.onerror = function() {
                    progressOverlay.classList.add('hidden');
                    showStatus('读取文件失败', 'error');
                    fileInput.value = '';
                };
                reader.readAsText(file, 'UTF-8');
            }

            function downloadSave() {
                if (!saveData) { showStatus('无存档数据', 'warning'); return }
                saveData.kingdoms = kingdoms;
                saveData[villageKey] = villages;
                const data = JSON.stringify(saveData, null, 2);
                const blob = new Blob([data], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                const name = fileBadge.textContent.replace('.json', '') || 'worldbox_save';
                a.download = `${name}_modified.json`;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => { document.body.removeChild(a);
                    URL.revokeObjectURL(url) }, 200);
                showStatus('存档已开始下载', 'success');
            }

            function queryActor(id) {
                if (!actorsData) return null;
                return actorsData.find(a => a.id === parseInt(id));
            }

            function queryKingdom(id) {
                if (!kingdoms) return null;
                return kingdoms.find(k => k.id === parseInt(id));
            }

            function queryItem(id) {
                if (!itemsData) return null;
                return itemsData.find(it => it.id === parseInt(id));
            }

            function renderActorPreview(inputId, label) {
                const container = $(`preview_${inputId}`);
                if (!container) return;
                const input = $(inputId);
                if (!input) return;
                const val = parseInt(input.value);
                if (isNaN(val) || val < 0) {
                    container.classList.remove('visible');
                    container.innerHTML = '';
                    return;
                }
                const actor = queryActor(val);
                if (!actor) {
                    container.classList.add('visible');
                    container.innerHTML = `<span class="text-gray-400">没有这个属性</span>`;
                    return;
                }
                container.classList.add('visible');
                const name = actor.name || '未命名';
                const asset = actor.asset_id || '?';
                const hp = actor.health !== undefined ? actor.health : '?';
                const x = actor.x || 0,
                    y = actor.y || 0;
                const traits = (actor.saved_traits && actor.saved_traits.length) ? actor.saved_traits.length : 0;
                container.innerHTML = `
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-1 text-xs">
                        <div><span class="label">关系</span><span class="val">${escapeHtml(label)}</span></div>
                        <div><span class="label">ID</span><span class="val">${actor.id}</span></div>
                        <div><span class="label">名称</span><span class="val">${escapeHtml(name)}</span></div>
                        <div><span class="label">种族</span><span class="val">${escapeHtml(asset)}</span></div>
                        <div><span class="label">生命</span><span class="val">${hp}</span></div>
                        <div><span class="label">位置</span><span class="val">(${x}, ${y})</span></div>
                        <div class="col-span-2"><span class="label">特质数</span><span class="val">${traits}</span></div>
                    </div>
                `;
            }

            function renderKingdomPreview(inputId) {
                const container = $(`preview_${inputId}`);
                if (!container) return;
                const input = $(inputId);
                if (!input) return;
                const val = parseInt(input.value);
                if (isNaN(val) || val < 0) {
                    container.classList.remove('visible');
                    container.innerHTML = '';
                    return;
                }
                const kingdom = queryKingdom(val);
                if (!kingdom) {
                    container.classList.add('visible');
                    container.innerHTML = `<span class="text-gray-400">没有这个属性</span>`;
                    return;
                }
                container.classList.add('visible');
                const name = kingdom.name || '未命名';
                const asset = kingdom.original_actor_asset || '?';
                const capital = kingdom.capitalID !== undefined ? kingdom.capitalID : '?';
                const motto = kingdom.motto || '无';
                container.innerHTML = `
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-1 text-xs">
                        <div><span class="label">关系</span><span class="val">所属王国</span></div>
                        <div><span class="label">ID</span><span class="val">${kingdom.id}</span></div>
                        <div><span class="label">名称</span><span class="val">${escapeHtml(name)}</span></div>
                        <div><span class="label">种族</span><span class="val">${escapeHtml(asset)}</span></div>
                        <div><span class="label">首都</span><span class="val">${capital}</span></div>
                        <div><span class="label">座右铭</span><span class="val">${escapeHtml(motto)}</span></div>
                    </div>
                `;
            }

            function renderItemPreviewForEquip(type) {
                const container = $(`preview_${type}`);
                if (!container) return;
                const input = document.querySelector(`.equip-add-input[data-type="${type}"]`);
                if (!input) return;
                const val = parseInt(input.value);
                if (isNaN(val) || val < 0) {
                    container.classList.remove('visible');
                    container.innerHTML = '';
                    return;
                }
                const item = queryItem(val);
                if (!item) {
                    container.classList.add('visible');
                    container.innerHTML = `<span class="text-gray-400">未找到物品</span>`;
                    return;
                }
                container.classList.add('visible');
                let typeLabel = '未知',
                    matLabel = '';
                if (item.asset_id) {
                    const p = item.asset_id.split('_');
                    if (p.length === 2) { typeLabel = TYPE_MAP[p[0]] || p[0];
                        matLabel = MAT_MAP[p[1]] || p[1] } else { typeLabel = TYPE_MAP[p[0]] || p[0] }
                }
                const mods = (item.modifiers || []).map(m => {
                    const match = m.match(/^([a-z]+)(\d+)?$/);
                    if (match) { const nameMap = { power: '力量', truth: '诚信', protection: '保护', speed: '速度',
                            balance: '协调', health: '健康', finesse: '技巧', mastery: '精通', knowledge: '学问',
                            sharpness: '锋利', flame: '灼烧', ice: '冰冻', slowness: '减速', poison: '淬毒' };
                        return (nameMap[match[1]] || match[1]) + (match[2] || '') } return m;
                }).join(' · ');
                container.innerHTML = `
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-1 text-xs">
                        <div><span class="label">名称</span><div class="val">${escapeHtml(item.name||'无')}</div></div>
                        <div><span class="label">种类</span><div class="val">${escapeHtml(typeLabel)}</div></div>
                        <div><span class="label">材质</span><div class="val">${escapeHtml(matLabel||'无')}</div></div>
                        <div><span class="label">制造者</span><div class="val">${escapeHtml(item.by||'无')}</div></div>
                        <div><span class="label">国家</span><div class="val">${escapeHtml(item.from||'无')}</div></div>
                        <div class="col-span-2"><span class="label">词条</span><div class="val">${escapeHtml(mods||'无')}</div></div>
                    </div>
                `;
            }

            fileInput.addEventListener('change', e => { if (e.target.files.length) handleFile(e.target.files[0]) });
            dropZone.addEventListener('dragover', e => { e.preventDefault();
                dropZone.style.borderColor = '#3b82f6';
                dropZone.style.backgroundColor = '#1e293b' });
            dropZone.addEventListener('dragleave', e => { e.preventDefault();
                dropZone.style.borderColor = '#374151';
                dropZone.style.backgroundColor = '#0f0f1a' });
            dropZone.addEventListener('drop', e => {
                e.preventDefault();
                dropZone.style.borderColor = '#374151';
                dropZone.style.backgroundColor = '#0f0f1a';
                if (e.dataTransfer.files.length) { const f = e.dataTransfer.files[0]; if (f.name.toLowerCase()
                        .endsWith('.json')) { fileInput.files = e.dataTransfer.files;
                        handleFile(f) } else showStatus('请拖入 .json 文件', 'error') }
            });

            kingdomSearch.addEventListener('input', function() { kingdomSearchText = this.value;
                renderKingdomList(); if (selectedKingdomIdx !== -1 && !kingdomFiltered.some(k => k._idx ===
                        selectedKingdomIdx)) { if (kingdomFiltered.length) selectKingdom(kingdomFiltered[0]._idx);
                    else { kingdomEditForm.classList.add('hidden');
                        kingdomFormEmpty.classList.remove('hidden');
                        villageEditSection.classList.add('hidden') } }
                renderVillageList() });
            villageSearch.addEventListener('input', function() { villageSearchText = this.value;
                renderVillageList(); if (selectedVillageIdx !== -1) { const v = villages[selectedVillageIdx]; if (!v || (
                        selectedKingdomIdx !== -1 && v.kingdomID !== kingdoms[selectedKingdomIdx].id)) { selectedVillageIdx =
                            -1;
                        villageEditForm.classList.add('hidden');
                        villageFormEmpty.classList.remove('hidden') } } });
            showAllVillagesCheck.addEventListener('change', function() { showAllVillages = this.checked;
                renderVillageList(); if (selectedVillageIdx !== -1) { const v = villages[selectedVillageIdx]; if (!v || (!
                        showAllVillages && selectedKingdomIdx !== -1 && v.kingdomID !== kingdoms[selectedKingdomIdx]
                        .id)) { selectedVillageIdx = -1;
                        villageEditForm.classList.add('hidden');
                        villageFormEmpty.classList.remove('hidden') } } });

            saveKingdomBtn.addEventListener('click', saveKingdom);
            resetKingdomBtn.addEventListener('click', resetKingdomSelection);
            addRulerBtn.addEventListener('click', function() { if (selectedKingdomIdx === -1) { showStatus(
                        '请先选择一个王国', 'warning'); return } currentRulers.push({ id: 0, color_id: 0, name: '新国王',
                        timestamp_ago: 0, timestamp_end: 0 });
                renderRulers() });
            saveVillageBtn.addEventListener('click', saveVillage);
            resetVillageBtn.addEventListener('click', resetVillageSelection);
            addVillageRulerBtn.addEventListener('click', function() { if (selectedVillageIdx === -1) { showStatus(
                        '请先选择一个村庄', 'warning'); return } currentVillageRulers.push({ id: 0, color_id: 0, name: '新村长',
                        timestamp_ago: 0, timestamp_end: 0 });
                renderVillageRulers() });
            addVillagePastNameBtn.addEventListener('click', function() { if (selectedVillageIdx === -1) { showStatus(
                        '请先选择一个村庄', 'warning'); return } currentVillagePastNames.push({ name: '新名称', timestamp: 0,
                        color_id: -1, custom: false });
                renderVillagePastNames() });
            document.querySelectorAll('.equip-add-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const type = this.dataset.type;
                    const input = document.querySelector(`.equip-add-input[data-type="${type}"]`);
                    if (!input) return;
                    const val = parseInt(input.value);
                    if (!isNaN(val) && val >= 0) { currentEquipment['item_storage_' + type].push(val);
                        renderEquipment();
                        input.value = '' } else showStatus('请输入有效的数字ID', 'warning');
                });
            });
            document.querySelectorAll('.equip-lookup-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const type = this.dataset.type;
                    renderItemPreviewForEquip(type);
                });
            });
            document.querySelectorAll('.lookup-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const target = this.dataset.target;
                    const type = this.dataset.type;
                    if (type === 'actor') renderActorPreview(target, '生物');
                    else if (type === 'kingdom') renderKingdomPreview(target);
                    else showStatus('未知查询类型', 'warning');
                });
            });
            addZoneBtn.addEventListener('click', function() { if (selectedVillageIdx === -1) { showStatus(
                        '请先选择一个村庄', 'warning'); return } currentZones.push({ x: 0, y: 0 });
                renderZones() });
            addResourceBtn.addEventListener('click', function() { if (selectedVillageIdx === -1) { showStatus(
                        '请先选择一个村庄', 'warning'); return } const id = resTypeSelect.value;
                const amt = parseInt(resAmountInput.value) || 0; if (amt < 0) { showStatus('数量不能为负', 'warning');
                    return } currentResources.push({ id, amount: amt });
                renderResources();
                resAmountInput.value = '1' });
            addResourceConfirmBtn.addEventListener('click', function() { addResourceBtn.click() });
            downloadBtn.addEventListener('click', downloadSave);

            window.addEventListener('dragover', e => e.preventDefault());
            window.addEventListener('drop', e => e.preventDefault());

            renderKingdomList();
            renderVillageList();
            if (kingdoms.length) selectKingdom(0);
        })();
    </script>
</body>
</html>
