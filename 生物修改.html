<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>世界盒子 · 生物修改</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link href="https://cdn.staticfile.net/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        * {
            scrollbar-width: thin;
            scrollbar-color: #4b5563 #1e1e1e
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px
        }
        ::-webkit-scrollbar-track {
            background: #1e1e1e;
            border-radius: 4px
        }
        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px
        }
        body {
            background: #121212;
            color: #e5e5e5;
            font-family: system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif;
            padding-bottom: env(safe-area-inset-bottom)
        }
        .card {
            background: #1e1e1e;
            border-radius: 1rem;
            border: 1px solid #2d2d2d;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            transition: transform .2s, box-shadow .2s;
            margin-bottom: 1.5rem;
            overflow: hidden
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
            border-color: #3b82f6
        }
        .custom-input {
            width: 100%;
            padding: .75rem 1rem .75rem 2.5rem;
            background-color: #0f0f0f;
            border: 1px solid #333;
            border-radius: .75rem;
            outline: none;
            transition: all .2s;
            font-size: 1rem;
            color: #f0f0f0
        }
        .custom-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
            background-color: #1a1a1a
        }
        .custom-input-sm {
            padding: .5rem .75rem;
            font-size: .875rem
        }
        .file-upload-wrapper {
            position: relative;
            width: 100%;
            height: 130px;
            border: 2px dashed #374151;
            border-radius: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all .2s;
            background-color: #0f0f1a
        }
        .file-upload-wrapper:hover {
            border-color: #3b82f6;
            background-color: #1e293b;
            transform: scale(.99)
        }
        .file-upload-wrapper input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer
        }
        .btn-primary {
            background: linear-gradient(105deg, #2563eb, #1d4ed8);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            transition: all .2s
        }
        .btn-primary:hover {
            background: linear-gradient(105deg, #3b82f6, #2563eb);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4)
        }
        .btn-success {
            background: linear-gradient(105deg, #059669, #047857);
            transition: all .2s
        }
        .btn-success:hover {
            background: linear-gradient(105deg, #10b981, #059669);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3)
        }
        .btn-secondary {
            background: linear-gradient(105deg, #4b5563, #374151);
            transition: all .2s
        }
        .btn-secondary:hover {
            background: linear-gradient(105deg, #6b7280, #4b5563);
            box-shadow: 0 4px 12px rgba(107, 114, 128, 0.3)
        }
        .btn-danger {
            background: linear-gradient(105deg, #dc2626, #b91c1c);
            transition: all .2s
        }
        .btn-danger:hover {
            background: linear-gradient(105deg, #ef4444, #dc2626);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3)
        }
        button:active {
            transform: scale(.97)
        }
        .badge-version {
            background: rgba(59, 130, 246, 0.2);
            backdrop-filter: blur(2px);
            border: 1px solid rgba(59, 130, 246, 0.4)
        }
        .status-message {
            background: #1e1e2f;
            border-left: 4px solid;
            border-radius: .75rem;
            padding: .75rem 1rem;
            font-size: .85rem;
            display: none;
            margin-bottom: 1rem
        }
        .status-message.success {
            border-left-color: #10b981;
            background: rgba(16, 185, 129, 0.1);
            color: #a7f3d0
        }
        .status-message.error {
            border-left-color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
            color: #fecaca
        }
        .status-message.warning {
            border-left-color: #f59e0b;
            background: rgba(245, 158, 11, 0.1);
            color: #fed7aa
        }
        .status-message.info {
            border-left-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
            color: #93c5fd
        }
        .fade-in {
            animation: fadeInUp .3s cubic-bezier(0.2, 0.9, 0.4, 1.1)
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(8px)
            }
            to {
                opacity: 1;
                transform: translateY(0)
            }
        }
        .actor-card {
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: .75rem;
            padding: .6rem .75rem;
            cursor: pointer;
            transition: all .2s;
            display: flex;
            align-items: center;
            gap: .5rem
        }
        .actor-card:hover {
            border-color: #3b82f6;
            background: #1a1a2a
        }
        .actor-card.active {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.12);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.08)
        }
        .actor-card .card-content {
            flex: 1;
            min-width: 0
        }
        .actor-list-container {
            max-height: calc(100vh - 420px);
            min-height: 200px;
            overflow-y: auto
        }
        .form-input {
            width: 100%;
            padding: .6rem .9rem;
            background-color: #0f0f0f;
            border: 1px solid #333;
            border-radius: .75rem;
            outline: none;
            transition: all .2s;
            font-size: .9rem;
            color: #f0f0f0
        }
        .form-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
            background-color: #1a1a1a
        }
        .form-select {
            width: 100%;
            padding: .6rem .9rem;
            background-color: #0f0f0f;
            border: 1px solid #333;
            border-radius: .75rem;
            outline: none;
            transition: all .2s;
            font-size: .9rem;
            color: #f0f0f0;
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right .75rem center;
            background-repeat: no-repeat;
            background-size: 1.2rem
        }
        .form-select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
            background-color: #1a1a1a
        }
        .form-label {
            display: block;
            font-size: .8rem;
            font-weight: 500;
            color: #9ca3af;
            margin-bottom: .3rem
        }
        .empty-state {
            color: #6b7280;
            text-align: center;
            padding: 2.5rem 1rem
        }
        .empty-state i {
            font-size: 2.5rem;
            opacity: .3;
            display: block;
            margin-bottom: .75rem
        }
        .hidden {
            display: none !important
        }
        .sort-bar {
            display: flex;
            gap: .5rem;
            align-items: center;
            margin-bottom: .5rem;
            flex-wrap: wrap
        }
        .sort-bar label {
            font-size: .75rem;
            color: #9ca3af
        }
        .sort-bar select {
            background: #0f0f0f;
            border: 1px solid #333;
            border-radius: .4rem;
            padding: .2rem .5rem;
            color: #f0f0f0;
            font-size: .8rem;
            outline: none
        }
        .sort-bar select:focus {
            border-color: #3b82f6
        }
        .actor-field-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: .5rem
        }
        .actor-field-grid .field {
            display: flex;
            flex-direction: column
        }
        .actor-field-grid .field label {
            font-size: .65rem;
            color: #6b7280;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: .03em
        }
        .actor-field-grid .field .input-row {
            display: flex;
            gap: .3rem;
            align-items: center
        }
        .actor-field-grid .field .input-row input {
            flex: 1;
            min-width: 0
        }
        .actor-field-grid .field .input-row .btn-sm {
            padding: .1rem .4rem;
            font-size: .7rem;
            border-radius: .3rem;
            background: #2d2d2d;
            color: #ccc;
            border: none;
            cursor: pointer;
            transition: .2s;
            white-space: nowrap;
            flex-shrink: 0
        }
        .actor-field-grid .field .input-row .btn-sm:hover {
            background: #4b5563
        }
        .actor-preview {
            margin-top: .2rem;
            font-size: .7rem;
            color: #9ca3af;
            background: #0f0f1a;
            border-radius: .3rem;
            padding: .2rem .4rem;
            border: 1px solid #2d2d2d;
            display: none
        }
        .actor-preview.visible {
            display: block
        }
        .actor-preview .label {
            color: #6b7280
        }
        .actor-preview .val {
            color: #e5e5e5
        }
        .trait-item {
            background: #0f0f1a;
            border: 1px solid #2d2d2d;
            border-radius: .5rem;
            padding: .4rem .6rem;
            display: flex;
            align-items: center;
            gap: .4rem;
            flex-wrap: wrap;
            margin-bottom: .3rem
        }
        .trait-item select,
        .trait-item input {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: .4rem;
            padding: .15rem .3rem;
            color: #f0f0f0;
            font-size: .75rem;
            outline: none
        }
        .trait-item select:focus,
        .trait-item input:focus {
            border-color: #3b82f6
        }
        .trait-item .count-input {
            width: 2.6rem
        }
        .trait-item .btn-sm {
            padding: .1rem .4rem;
            font-size: .7rem;
            border-radius: .3rem;
            background: #2d2d2d;
            color: #ccc;
            border: none;
            cursor: pointer;
            transition: .2s
        }
        .trait-item .btn-sm:hover {
            background: #4b5563
        }
        .trait-item .btn-sm.danger {
            background: #7f1d1d
        }
        .trait-item .btn-sm.danger:hover {
            background: #b91c1c
        }
        .trait-item .label-tag {
            font-size: .6rem;
            color: #6b7280
        }
        .item-preview-card {
            background: #0f0f1a;
            border: 1px solid #2d2d2d;
            border-radius: .5rem;
            padding: .4rem .6rem;
            margin-top: .3rem;
            font-size: .75rem;
            color: #9ca3af
        }
        .item-preview-card .label {
            color: #6b7280;
            font-size: .65rem
        }
        .item-preview-card .val {
            color: #e5e5e5
        }
        .item-tag {
            display: inline-flex;
            align-items: center;
            gap: .2rem;
            background: #1a1a2a;
            border: 1px solid #2d2d2d;
            border-radius: .3rem;
            padding: .1rem .5rem;
            font-size: .7rem;
            color: #93c5fd;
            cursor: default
        }
        .item-tag .remove-item {
            cursor: pointer;
            color: #6b7280;
            font-size: .6rem;
            margin-left: .2rem
        }
        .item-tag .remove-item:hover {
            color: #ef4444
        }
        .history-list {
            max-height: 120px;
            overflow-y: auto;
            background: #0f0f1a;
            border-radius: .5rem;
            padding: .25rem
        }
        .history-item {
            padding: .2rem .5rem;
            font-size: .75rem;
            border-bottom: 1px solid #262626;
            cursor: pointer;
            display: flex;
            justify-content: space-between
        }
        .history-item:hover {
            background: #1a1a2a
        }
        .progress-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            backdrop-filter: blur(4px);
            transition: opacity .3s;
        }
        .progress-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .progress-box {
            background: #1e1e2e;
            border-radius: 1.5rem;
            padding: 2rem 2.5rem;
            max-width: 90vw;
            width: 400px;
            text-align: center;
            border: 1px solid #3b82f6;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }
        .progress-box .title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #93c5fd;
            margin-bottom: .5rem;
        }
        .progress-box .sub {
            font-size: .85rem;
            color: #9ca3af;
            margin-bottom: 1.2rem;
        }
        .progress-track {
            width: 100%;
            height: 8px;
            background: #2d2d3d;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: .6rem;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            border-radius: 4px;
            transition: width .15s ease;
        }
        .progress-text {
            font-size: .8rem;
            color: #6b7280;
        }
        .progress-text strong {
            color: #e5e5e5;
        }
        .batch-area {
            background: #0f0f1a;
            border-radius: .75rem;
            padding: .75rem;
            border: 1px solid #2d2d2d;
            margin-top: .5rem
        }
        .batch-area .grid {
            gap: .5rem
        }
        .batch-area .grid>div {
            min-width: 0
        }
        .tab-nav {
            display: flex;
            gap: 0;
            background: #1a1a1a;
            border-radius: .75rem;
            border: 1px solid #2d2d2d;
            overflow: hidden;
            margin-bottom: 1.5rem
        }
        .tab-nav a {
            flex: 1;
            padding: .7rem 1rem;
            background: transparent;
            border: none;
            color: #9ca3af;
            font-size: .9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all .2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .5rem;
            border-bottom: 2px solid transparent;
            text-decoration: none
        }
        .tab-nav a:hover {
            color: #e5e5e5;
            background: #1e1e2e
        }
        .tab-nav a.active {
            color: #60a5fa;
            border-bottom-color: #3b82f6;
            background: rgba(59, 130, 246, 0.08)
        }
        .tab-nav a i {
            font-size: .9rem
        }
        .cf-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: .5rem
        }
        .cf-grid .field label {
            font-size: .65rem;
            color: #6b7280;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: .03em
        }
        .cf-grid .field input {
            background: #0f0f0f;
            border: 1px solid #333;
            border-radius: .4rem;
            padding: .2rem .4rem;
            color: #f0f0f0;
            font-size: .8rem;
            outline: none;
            width: 100%;
            transition: .2s
        }
        .cf-grid .field input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15)
        }
        @media(max-width:768px) {
            .actor-list-container {
                max-height: 30vh;
                min-height: 100px
            }
            .actor-card {
                padding: .5rem .6rem
            }
            .card .p-4 {
                padding: .75rem
            }
            .form-label {
                font-size: .7rem
            }
            .actor-field-grid {
                grid-template-columns: 1fr 1fr
            }
            .cf-grid {
                grid-template-columns: 1fr 1fr
            }
            .tab-nav a {
                font-size: .75rem;
                padding: .5rem .5rem
            }
            .tab-nav a i {
                font-size: .75rem
            }
            .batch-area .grid {
                grid-template-columns: 1fr 1fr
            }
            .progress-box {
                padding: 1.5rem;
                width: 90vw;
            }
        }
        @media(max-width:480px) {
            .actor-field-grid {
                grid-template-columns: 1fr
            }
            .cf-grid {
                grid-template-columns: 1fr
            }
            .tab-nav a {
                font-size: .65rem;
                padding: .4rem .3rem;
                gap: .2rem
            }
            .tab-nav a i {
                font-size: .65rem
            }
            .batch-area .grid {
                grid-template-columns: 1fr
            }
        }
    </style>
</head>
<body>
    <header class="bg-gradient-to-r from-slate-900 via-gray-900 to-indigo-900 border-b border-indigo-500/30 sticky top-0 z-50 shadow-2xl backdrop-blur-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-dungeon text-indigo-400 text-xl"></i>
                <div>
                    <h1 class="text-lg font-bold bg-gradient-to-r from-blue-400 to-indigo-300 bg-clip-text text-transparent">世界盒子 · 生物修改</h1>
                    <p class="text-[10px] text-gray-400 hidden xs:block">生物属性 · 特质 · 物品 · 一键修改</p>
                </div>
            </div>
            <div class="badge-version text-xs px-2 py-0.5 rounded-full text-indigo-300 font-mono flex items-center gap-1">
                <span id="file-badge">未加载</span>
                <i class="fa-regular fa-circle-check text-emerald-400 hidden" id="loaded-icon"></i>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 pt-2">
        <div id="statusArea" class="status-message fade-in"></div>

        <div class="tab-nav" id="mainTabs">
            <a href="武器修改.html"><i class="fa-solid fa-sword"></i> 武器修改</a>
            <a href="王国与村庄修改.html"><i class="fa-solid fa-crown"></i> 王国与村庄修改</a>
            <a href="生物修改.html" class="active"><i class="fa-solid fa-user"></i> 生物修改</a>
        </div>

        <div id="uploadSection" class="card p-4">
            <div class="flex items-center gap-2 border-b border-gray-800 pb-2 mb-3">
                <i class="fa-solid fa-cloud-upload-alt text-indigo-400"></i>
                <h2 class="text-base font-semibold text-indigo-300">上传存档</h2>
            </div>
            <div class="file-upload-wrapper" id="dropZone">
                <input type="file" id="fileInput" accept=".json">
                <i class="fa-solid fa-file-json text-3xl text-indigo-400/60 mb-1"></i>
                <p class="text-sm text-gray-400 font-medium" id="fileNameDisplay">点击或拖拽 .json 存档文件至此</p>
                <p class="text-xs text-gray-500 mt-0.5">世界盒子存档 · 本地处理</p>
            </div>
        </div>

        <div id="editorContainer" class="hidden">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-3">
                <div class="lg:col-span-4 card p-3">
                    <div class="flex items-center gap-2 border-b border-gray-800 pb-2 mb-2">
                        <i class="fa-solid fa-list-ul text-indigo-400"></i>
                        <h2 class="text-base font-semibold text-indigo-300">生物列表</h2>
                        <span class="ml-auto text-xs text-gray-500" id="actorCount">0 个</span>
                    </div>
                    <div class="flex gap-2 mb-2 flex-wrap">
                        <div class="relative flex-1 min-w-[100px]">
                            <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 text-sm"></i>
                            <input type="text" id="actorSearch" placeholder="搜索..." class="custom-input custom-input-sm pl-8 w-full">
                        </div>
                        <select id="actorRaceFilter" class="form-select text-sm flex-1 min-w-[80px]">
                            <option value="">全部种族</option>
                        </select>
                    </div>
                    <div class="sort-bar">
                        <label>排序：</label>
                        <select id="actorSort">
                            <option value="default">默认顺序</option>
                            <option value="name">按名称</option>
                            <option value="id">按ID</option>
                            <option value="health">按生命</option>
                        </select>
                    </div>
                    <div class="actor-list-container" id="actorList">
                        <div class="empty-state"><i class="fa-regular fa-user"></i>请上传存档文件</div>
                    </div>
                </div>
                <div class="lg:col-span-8 card p-3">
                    <div class="flex items-center justify-between border-b border-gray-800 pb-2 mb-3 flex-wrap gap-1">
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-pen-to-square text-indigo-400"></i>
                            <h2 class="text-base font-semibold text-indigo-300">生物编辑</h2>
                        </div>
                        <div class="flex gap-1">

            function pushHistory() {
                const snap = { ts: Date.now(), actors: JSON.parse(JSON.stringify(actors)) };
                if (historyIdx < history.length - 1) history = history.slice(0, historyIdx + 1);
                history.push(snap);
                if (history.length > 30) history.shift();
                historyIdx = history.length - 1;
                renderHistory();

            function renderHistory() {

                history.forEach((h, i) => {
                    const d = document.createElement('div');
                    d.className = 'history-item';
                    d.innerHTML =
                        `<span>#${i+1} (生物${h.actors.length}) ${i===historyIdx?'⬅️':''}</span><span class="text-gray-500">${new Date(h.ts).toLocaleTimeString()}</span>`;

                        if (i >= 0 && i < history.length) {
                            historyIdx = i;
                            actors = JSON.parse(JSON.stringify(history[i].actors));

                            $('actorEditForm').classList.add('hidden');

            function renderList() {
                if (!actors.length) {
                    $('actorList').innerHTML = `<div class="empty-state"><i class="fa-regular fa-user"></i>无生物数据</div>`;
                    $('actorCount').textContent = '0 个';
                    return;
                }
                const q = searchText.toLowerCase();
                filtered = actors.map((a, i) => ({ ...a, _idx: i })).filter(a => {
                    if (raceFilter && a.asset_id !== raceFilter) return false;
                    if (!q) return true;
                    const n = (a.name || '').toLowerCase(),
                        id = String(a.id || ''),
                        asset = (a.asset_id || '').toLowerCase();
                    return n.includes(q) || id.includes(q) || asset.includes(q);
                });
                if (sortKey !== 'default') {
                    filtered.sort((a, b) => {
                        if (sortKey === 'name') { const na = (a.name || '').toLowerCase(),
                                nb = (b.name || '').toLowerCase(); return na.localeCompare(nb) } if (sortKey ===
                            'id') return (a.id || 0) - (b.id || 0); if (sortKey === 'health') return (b.health ||
                            0) - (a.health || 0); return 0;
                    });

                    return;

            function renderTraits() {
                const container = $('traitList');
                if (!currentTraits.length) {
                    container.innerHTML = `<div class="text-xs text-gray-500 py-1">无特质</div>`;
                    return;
                }
                const map = {};
                currentTraits.forEach(t => { map[t] = (map[t] || 0) + 1 });
                const keys = Object.keys(map);
                let html = '';
                keys.forEach((t, idx) => {
                    const cnt = map[t];
                    html += `<div class="trait-item" data-key="${t}">
                        <select class="trait-type">${TRAIT_LIST.map(t2 => `<option value="${t2}" ${t2===t?'selected':''}>${TRAIT_NAMES[t2]} (${t2})</option>`).join('')}</select>
                        <span class="label-tag">数量</span>
                        <input type="number" class="trait-count count-input" min="1" max="99" value="${cnt}">
                        <button type="button" class="btn-sm move-up" ${idx===0?'disabled':''}><i class="fa-solid fa-arrow-up"></i></button>
                        <button type="button" class="btn-sm move-down" ${idx===keys.length-1?'disabled':''}><i class="fa-solid fa-arrow-down"></i></button>
                        <button type="button" class="btn-sm danger remove-trait"><i class="fa-solid fa-xmark"></i></button>
                    </div>`;
                });
                container.innerHTML = html;
                container.querySelectorAll('.trait-item').forEach((div, idx) => {
                    const typeSel = div.querySelector('.trait-type');
                    const countInp = div.querySelector('.trait-count');
                    const update = () => {
                        const newTraits = [];
                        container.querySelectorAll('.trait-item').forEach((d) => {
                            const t = d.querySelector('.trait-type').value;
                            const c = Math.max(1, parseInt(d.querySelector('.trait-count').value) || 1);
                            for (let j = 0; j < c; j++) newTraits.push(t);
                        });
                        currentTraits = newTraits;
                        renderTraits();
                    };
                    typeSel.addEventListener('change', update);
                    countInp.addEventListener('change', update);
                    div.querySelector('.move-up').addEventListener('click', function() {
                        if (idx > 0) { const items = container.querySelectorAll('.trait-item');
                            const keys2 = Array.from(items).map(d => d.dataset.key);
                            [keys2[idx - 1], keys2[idx]] = [keys2[idx], keys2[idx - 1]];
                            const newTraits = [];
                            keys2.forEach(k => { const c = map[k] || 1; for (let j = 0; j < c; j++)
                                    newTraits.push(k) });
                            currentTraits = newTraits;
                            renderTraits();
                        }
                    });
                    div.querySelector('.move-down').addEventListener('click', function() {
                        const items = container.querySelectorAll('.trait-item');
                        if (idx < items.length - 1) { const keys2 = Array.from(items).map(d => d.dataset
                            .key);
                            [keys2[idx + 1], keys2[idx]] = [keys2[idx], keys2[idx + 1]];
                            const newTraits = [];
                            keys2.forEach(k => { const c = map[k] || 1; for (let j = 0; j < c; j++)
                                    newTraits.push(k) });
                            currentTraits = newTraits;
                            renderTraits();
                        }
                    });
                    div.querySelector('.remove-trait').addEventListener('click', function() {
                        const key2 = div.dataset.key;
                        currentTraits = currentTraits.filter(t => t !== key2);
                        renderTraits();
                    });
                });
            }

                    'a_subspecies': 'subspecies',
                    'a_language': 'language',
                    'a_religion': 'religion',
                    'a_generation': 'generation',
                    'a_cityID': 'cityID',
                    'a_kingdomID': 'civ_kingdom_id',
                    'a_army': 'army',
                    'a_lover': 'lover',
                    'a_bestfriend': 'best_friend_id',
                    'a_family': 'family',
                    'a_ancestor': 'ancestor_family',
                    'a_parent1': 'parent_id_1',
                    'a_parent2': 'parent_id_2',
                    'a_head': 'head',
                    'a_pheno_idx': 'phenotype_index',
                    'a_pheno_shade': 'phenotype_shade',
                    'a_age_over': 'age_overgrowth',
                    'a_created': 'created_time',
                    'a_sex': 'sex',
                    'a_clan': 'clan',
                    'a_health': 'health',
                    'a_stamina': 'stamina',
                    'a_mana': 'mana',
                    'a_happiness': 'happiness',
                    'a_nutrition': 'nutrition',
                    'a_money': 'money',
                    'a_kills': 'kills',
                    'a_food': 'food_consumed',
                    'a_births': 'births',
                    'a_loot': 'loot',
                    'a_renown': 'renown',
                    'a_experience': 'experience',
                    'a_level': 'level'
                };
                Object.keys(map).forEach(id => {
                    const el = $(id);
                    if (el) {
                        let v = el.value;
                        const field = map[id];
                        if (field !== 'name' && field !== 'asset_id') { v = parseFloat(v); if (isNaN(v)) v =
                            0 }
                        a[field] = v;
                    }
                });
                if (!a.custom_data_float) a.custom_data_float = {};
                ['cf_diplomacy', 'cf_warfare', 'cf_intelligence', 'cf_stewardship'].forEach(id => {
                    const el = $(id);
                    if (el) {
                        const key = id.replace('cf_', '');
                        let v = parseFloat(el.value);
                        if (isNaN(v)) v = 0;
                        a.custom_data_float[key] = v;
                    }
                });
                a.saved_traits = currentTraits.slice();
                a.saved_items = currentItems.slice();
                renderList();
                showStatus(`✓ 生物 #${selectedIdx+1} 已保存`, 'success');
            }

            function batchApply(targets) {
                if (!targets.length) { showStatus('没有目标生物', 'warning'); return }
                if (!confirm(`确定批量修改 ${targets.length} 个生物吗？`)) return;
                pushHistory();
                const ops = [
                    { op: $('batchHealthOp').value, val: parseInt($('batchHealthVal').value) || 0, field: 'health' },
                    { op: $('batchStaminaOp').value, val: parseInt($('batchStaminaVal').value) || 0, field: 'stamina' },
                    { op: $('batchManaOp').value, val: parseInt($('batchManaVal').value) || 0, field: 'mana' },
                    { op: $('batchHappinessOp').value, val: parseInt($('batchHappinessVal').value) || 0,
                        field: 'happiness' }
                ];
                const addTrait = $('batchTraitSelect').value;
                const addCount = Math.max(1, parseInt($('batchTraitCount').value) || 1);
                const removeTrait = $('batchRemoveTrait').value;
                targets.forEach(a => {
                    ops.forEach(({ op, val, field }) => {
                        if (val !== 0) {
                            let cur = a[field] || 0;
                            if (op === 'set') cur = val;
                            else if (op === 'add') cur += val;
                            else if (op === 'sub') cur -= val;
                            if (cur < 0) cur = 0;
                            if (cur > MAX_INT) cur = MAX_INT;
                            a[field] = cur;
                        }
                    });
                    if (addTrait) {
                        if (!a.saved_traits) a.saved_traits = [];
                        for (let i = 0; i < addCount; i++) a.saved_traits.push(addTrait);
                    }
                    if (removeTrait && a.saved_traits) {
                        a.saved_traits = a.saved_traits.filter(t => t !== removeTrait);
                        if (!a.saved_traits.length) delete a.saved_traits;
                    }
                });
                renderList();
                if (selectedIdx >= 0) {
                    const a = actors[selectedIdx];
                    ['a_health', 'a_stamina', 'a_mana', 'a_happiness'].forEach(id => {
                        const el = $(id);
                        if (el) { const field = { a_health: 'health', a_stamina: 'stamina',
                                a_mana: 'mana', a_happiness: 'happiness' } [id];
                            el.value = a[field] !== undefined ? a[field] : '' }
                    });
                    currentTraits = (a.saved_traits || []).slice();
                    renderTraits();
                }
                showStatus(`批量修改应用到 ${targets.length} 个生物`, 'success');
            }

            function handleFile(file) {
                if (!file) { showStatus('未选择文件', 'error'); return }
                if (!file.name.toLowerCase().endsWith('.json')) { showStatus('请上传 .json 文件', 'error'); return }
                const overlay = $('progressOverlay');
                overlay.classList.remove('hidden');
                $('progressBar').style.width = '0%';
                $('progressPercent').textContent = '0';
                $('progressSub').textContent = '读取文件...';
                const reader = new FileReader();
                reader.onprogress = function(e) {
                    if (e.lengthComputable) {
                        const pct = Math.round((e.loaded / e.total) * 80);
                        $('progressBar').style.width = pct + '%';
                        $('progressPercent').textContent = pct;
                        $('progressSub').textContent = `读取中 ${pct}%`;
                    }
                };
                reader.onload = function(e) {
                    $('progressSub').textContent = '解析数据...';
                    $('progressBar').style.width = '85%';
                    $('progressPercent').textContent = '85';
                    setTimeout(() => {
                        try {
                            const json = JSON.parse(e.target.result);
                            if (!json.items || !Array.isArray(json.items)) {
                                throw new Error('缺少 items 数组，请确认是有效的世界盒子存档');
                            }
                            saveData = json;
                            actors = json.actors_data || [];
                            actors.forEach(a => {
                                if (!a.saved_traits) a.saved_traits = [];
                                if (!a.saved_items) a.saved_items = [];
                                if (!a.custom_data_float) a.custom_data_float = {};
                            });
                            cities = json.cities || json.villages || json.Villages || json.village || [];
                            kingdoms = json.kingdoms || json.Kingdoms || [];
                            itemsData = json.items || [];
                            history = [];
                            historyIdx = -1;
                            renderHistory();
                            selectedIdx = -1;
                            searchText = '';
                            $('actorSearch').value = '';
                            raceFilter = '';
                            $('actorRaceFilter').value = '';
                            sortKey = 'default';
                            $('actorSort').value = 'default';
                            $('fileNameDisplay').innerHTML =
                                `<i class="fa-regular fa-file-lines mr-1"></i> ${esc(file.name)} (${actors.length}个生物)`;
                            $('fileNameDisplay').classList.add('text-indigo-400', 'font-semibold');
                            $('file-badge').textContent = file.name;
                            $('loaded-icon').classList.remove('hidden');
                            $('uploadSection').classList.add('hidden');
                            $('editorContainer').classList.remove('hidden');
                            $('editorContainer').classList.add('fade-in');
                            populateFilters();
                            renderList();
                            $('actorEditForm').classList.add('hidden');
                            $('actorFormEmpty').classList.remove('hidden');
                            const brt = $('batchRemoveTrait');
                            brt.innerHTML = '<option value="">选择</option>';
                            TRAIT_LIST.forEach(t => { const o = document.createElement('option');
                                o.value = t;
                                o.textContent = TRAIT_NAMES[t] + ' (' + t + ')';
                                brt.appendChild(o) });
                            $('progressBar').style.width = '100%';
                            $('progressPercent').textContent = '100';
                            $('progressSub').textContent = '加载完成';
                            setTimeout(() => {
                                overlay.classList.add('hidden');
                                showStatus(`✓ 加载成功！${actors.length} 个生物`, 'success');
                            }, 300);
                        } catch (err) {
                            console.error(err);
                            overlay.classList.add('hidden');
                            showStatus('解析失败: ' + err.message, 'error');
                            $('fileInput').value = '';
                        }
                    }, 50);
                };
                reader.onerror = function() {
                    overlay.classList.add('hidden');
                    showStatus('读取文件失败', 'error');
                    $('fileInput').value = '';
                };
                reader.readAsText(file, 'UTF-8');
            }

            function downloadSave() {
                if (!saveData) { showStatus('无存档数据', 'warning'); return }
                saveData.actors_data = actors;
                const data = JSON.stringify(saveData, null, 2);
                const blob = new Blob([data], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                const name = $('file-badge').textContent.replace('.json', '') || 'worldbox_save';
                a.download = `${name}_modified.json`;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => { document.body.removeChild(a);
                    URL.revokeObjectURL(url) }, 200);
                showStatus('存档已开始下载', 'success');
            }

            const fileInput = $('fileInput'),
                dropZone = $('dropZone');
            fileInput.addEventListener('change', e => { if (e.target.files.length) handleFile(e.target.files[0]) });
            dropZone.addEventListener('dragover', e => { e.preventDefault();
                dropZone.style.borderColor = '#3b82f6';
                dropZone.style.backgroundColor = '#1e293b' });
            dropZone.addEventListener('dragleave', e => { e.preventDefault();
                dropZone.style.borderColor = '#374151';
                dropZone.style.backgroundColor = '#0f0f1a' });
            dropZone.addEventListener('drop', e => {
                e.preventDefault();
                dropZone.style.borderColor = '#374151';
                dropZone.style.backgroundColor = '#0f0f1a';
                if (e.dataTransfer.files.length) {
                    const f = e.dataTransfer.files[0];
                    if (f.name.toLowerCase().endsWith('.json')) { fileInput.files = e.dataTransfer.files;
                        handleFile(f) } else showStatus('请拖入 .json 文件', 'error');
                }
            });

            $('actorSearch').addEventListener('input', function() { searchText = this.value;
                renderList() });
            $('actorRaceFilter').addEventListener('change', function() { raceFilter = this.value;
                renderList() });
            $('actorSort').addEventListener('change', function() { sortKey = this.value;
                renderList() });

            $('saveActorBtn').addEventListener('click', saveActor);
            $('resetActorBtn').addEventListener('click', function() {
                selectedIdx = -1;
                $('actorEditForm').classList.add('hidden');
                $('actorFormEmpty').classList.remove('hidden');
                renderList();
                showStatus('已取消选择', 'info');
            });

            $('addTraitConfirmBtn').addEventListener('click', function() {
                const val = $('traitSelect').value;
                const cnt = Math.max(1, parseInt($('traitCountInput').value) || 1);
                if (val) { for (let i = 0; i < cnt; i++) currentTraits.push(val);
                    renderTraits() }
            });
            $('addTraitBtn').addEventListener('click', function() { $('addTraitConfirmBtn').click() });

            $('addItemConfirmBtn').addEventListener('click', function() {
                const val = parseInt($('itemAddInput').value);
                if (!isNaN(val) && val >= 0) { currentItems.push(val);
                    renderItems();
                    $('itemAddInput').value = '' } else showStatus('请输入有效ID', 'warning');
            });
            $('addItemBtn').addEventListener('click', function() { $('addItemConfirmBtn').click() });
            $('itemLookupBtn').addEventListener('click', function() {
                const val = parseInt($('itemAddInput').value);
                if (!isNaN(val) && val >= 0) renderItemPreview(val);
                else showStatus('请输入有效ID', 'warning');
            });

            document.querySelectorAll('.lookup-actor').forEach(btn => {
                btn.addEventListener('click', function() {
                    const target = this.dataset.target;
                    const label = this.dataset.label || '生物';
                    renderActorPreview(target, label);
                });
            });
            document.querySelectorAll('.lookup-kingdom').forEach(btn => {
                btn.addEventListener('click', function() {
                    const target = this.dataset.target;
                    renderKingdomPreview(target);
                });
            });
            document.querySelectorAll('.lookup-city').forEach(btn => {
                btn.addEventListener('click', function() {
                    const target = this.dataset.target;
                    renderCityPreview(target);
                });
            });

            $('actorUndoBtn').addEventListener('click', function() {
                if (historyIdx > 0) {
                    historyIdx--;
                    const snap = history[historyIdx];
                    actors = JSON.parse(JSON.stringify(snap.actors));
                    selectedIdx = -1;
                    $('actorEditForm').classList.add('hidden');
                    $('actorFormEmpty').classList.remove('hidden');
                    renderList();
                    showStatus('已撤销', 'info');
                } else showStatus('没有更早的历史', 'warning');
                renderHistory();
            });
            $('actorHistoryToggle').addEventListener('click', function() {
                const p = $('actorHistoryPanel');
                p.classList.toggle('hidden');
                if (!p.classList.contains('hidden')) renderHistory();
            });
            $('actorClearHistoryBtn').addEventListener('click', function() { history = [];
                historyIdx = -1;
                renderHistory();
                showStatus('历史已清空', 'info') });

            $('batchToggle').addEventListener('click', function() {
                $('batchContent').classList.toggle('hidden');
            });
            $('batchApplyBtn').addEventListener('click', function() {
                const targets = [];
                if (selectedIdx >= 0 && selectedIdx < actors.length) targets.push(actors[selectedIdx]);
                if (!targets.length) { showStatus('请先选择一个生物', 'warning'); return }
                batchApply(targets);
            });
            $('batchApplyAllBtn').addEventListener('click', function() {
                if (!actors.length) { showStatus('没有生物', 'warning'); return }
                batchApply(actors);
            });
            $('batchAddTraitBtn').addEventListener('click', function() {
                showStatus('已设置添加特质，点击"应用到勾选/全部"生效', 'info');
            });
            $('batchRemoveTraitBtn').addEventListener('click', function() {
                showStatus('已设置移除特质，点击"应用到勾选/全部"生效', 'info');
            });

            $('downloadBtn').addEventListener('click', downloadSave);

            window.addEventListener('dragover', e => e.preventDefault());
            window.addEventListener('drop', e => e.preventDefault());

            renderList();
            renderHistory();
        })();
    </script>
</body>
</html>
